[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "apb-catalog"
version = "0.1.4"
description = "Semantic source catalogues and column resolution for APB results"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Witold Wolski", email = "wew@fgcz.ethz.ch" },
]
keywords = ["proteomics", "anndata", "metadata", "catalogue", "mass spectrometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "anndata>=0.11",
    "apb2>=0.1,<0.2",
    "cyclopts>=4,<5",
    "mudata>=0.4,<1",
    "numpy>=2",
    "pandas>=2.2",
    "polars>=1.43,<2",
    "pydantic>=2.10",
]

[project.scripts]
apb-catalog = "apb_catalog.cli:main"

[project.urls]
Documentation = "https://anndata-omics-bridge.github.io/apb-catalog/"
Repository = "https://github.com/anndata-omics-bridge/apb-catalog"

[tool.uv.sources]
apb2 = { path = "../apb2", editable = true }

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4,<5",
    "pyright==1.1.414",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.16.10",
    "twine>=6,<7",
]
docs = [
    "pymdown-extensions>=11,<12",
    "zensical==0.0.43",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PGH",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false
# pandas, AnnData and MuData still propagate Unknown through supported public operations.
# Keep strict first-party checking while suppressing diagnostics with only that signal.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["apb_catalog"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["apb_catalog"]
