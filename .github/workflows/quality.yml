name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize documentation environment
        run: uv sync --frozen --only-group docs

      - name: Build documentation
        run: uv run --no-sync zensical build --clean --strict

  standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize standalone quality environment
        run: uv sync --frozen --only-group dev

      - name: Run standalone quality gates
        run: make format-check lint deps build

  full-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apb-catalog
    steps:
      - name: Check out APB Catalog
        uses: actions/checkout@v6
        with:
          path: apb-catalog

      # Catalogue fingerprints are reviewed against this APB2 revision; bump it with a re-review.
      - name: Check out reviewed APB2
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb2
          ref: f6131af4b71562546b19af389060930ca4eec32c
          path: apb2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize complete environment
        run: uv sync --frozen --group dev --group docs

      - name: Run complete quality gate
        run: make check
