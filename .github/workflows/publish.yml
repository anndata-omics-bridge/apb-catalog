name: Publish

# A published GitHub release tagged v<version> uploads to PyPI through trusted publishing, so the
# repository stores no API token. A manual run only builds and checks the distributions.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Python 3.13, as the quality workflow: the newest CPython has no h5py wheel yet, and building h5py
# from source needs HDF5.
env:
  UV_PYTHON: "3.13"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python
        run: uv python install 3.13

      - name: Check release tag matches project version
        if: github.event_name == 'release'
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apb-catalog
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The language bundle and its test bundle, attached to the release. `make update-bundle` in
  # apbCatalogR ships them from there.
  bundle:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apb-catalog
    steps:
      - name: Check out APB Catalog
        uses: actions/checkout@v7
        with:
          path: apb-catalog

      - name: Check out APB2
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb2
          path: apb2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize environment
        run: uv sync --group dev

      - name: Build the bundles
        run: make bundle

      - name: Attach the bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          build/apb-catalog-bundle.tar.gz build/apb-catalog-test-bundle.tar.gz --clobber

