name: Publish

# A published GitHub release tagged v<version> uploads to PyPI through trusted publishing, so the
# repository stores no API token. A manual run only builds and checks the distributions.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python
        run: uv python install

      - name: Check release tag matches project version
        if: github.event_name == 'release'
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apb-catalog
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The language bundle: attached to the release, and copied into apbCatalogR by a pull request.
  # The pull request needs a GitHub App installed on apbCatalogR, with its id and private key in
  # the secrets APB_BUNDLE_APP_ID and APB_BUNDLE_APP_KEY.
  bundle:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apb-catalog
    steps:
      - name: Check out APB Catalog
        uses: actions/checkout@v7
        with:
          path: apb-catalog

      - name: Check out APB2
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb2
          path: apb2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python
        run: uv python install

      - name: Synchronize environment
        run: uv sync --group dev

      - name: Build the bundle
        run: make bundle

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/apb-catalog-bundle.tar.gz --clobber

      - name: Keep the bundle folder for the pull request
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: apb-catalog/build/apb-catalog-bundle/

  update-apbcatalogr:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Create a token for apbCatalogR
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APB_BUNDLE_APP_ID }}
          private-key: ${{ secrets.APB_BUNDLE_APP_KEY }}
          owner: anndata-omics-bridge
          repositories: apbCatalogR

      - name: Check out apbCatalogR
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apbCatalogR
          token: ${{ steps.token.outputs.token }}

      - name: Remove the shipped bundle
        run: rm -rf inst/extdata/bundle

      - name: Put the new bundle in its place
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: inst/extdata/bundle

      - name: Open the update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.token.outputs.token }}
          branch: bundle/${{ github.ref_name }}
          commit-message: Ship the apb-catalog ${{ github.ref_name }} bundle
          title: Ship the apb-catalog ${{ github.ref_name }} bundle
          body: Replaces `inst/extdata/bundle/` with the bundle of apb-catalog release ${{ github.ref_name }}.
