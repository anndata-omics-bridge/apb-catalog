name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages serves only public repositories on the organisation's free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize documentation environment
        run: uv sync --frozen --only-group docs

      - name: Build documentation
        run: uv run --no-sync zensical build --clean --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
